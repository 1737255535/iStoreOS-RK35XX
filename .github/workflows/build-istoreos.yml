name: Build iStore OS

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "选择要编译的设备"
        required: false
        default: "panther_x2"
        type: choice
        options:
          - panther_x2
          - jp_tvbox
          - fastrhino_r6xs
          - fastrhino_r66s
          - fastrhino_r68s
          - firefly_station-p2
          - friendlyarm_nanopi-r5s
          - friendlyarm_nanopi-r6s
          - hinlink_h88k
          - hinlink_opc-h6xk
          - dg_nas-lite
          - ezpro_mrkaio-m68s
          - ezpro_mrkaio-m68s-plus
          - dg_tn3568
          - yijiahe_jm10
          - xunlong_orangepi-5-plus
          - lyt_t68m
      openwrt_kernel:
        description: "选择内核版本"
        required: false
        default: "5.10.y"
        type: choice
        options:
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
      auto_kernel:
        description: "自动使用最新内核"
        required: false
        default: true
        type: boolean
      kernel_repo:
        description: "内核仓库"
        required: false
        default: "1737255535/kernel"
        type: choice
        options:
          - 1737255535/kernel
          - ophub/kernel
      source_branch:
        description: "选择源码分支"
        required: false
        default: "istoreos-24.10"
        type: choice
        options:
          - istoreos-24.10
          - istoreos-23.05
          - main
  schedule:
   - cron: 0 16 * * *

env:
  REPO_URL: https://github.com/istoreos/istoreos
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write
    strategy:
      matrix:
        REPO_BRANCH:
          - ${{ github.event.inputs.source_branch || 'istoreos-24.10' }}
        ARCHITECTURE:
          - rk35xx
        os:
          - ubuntu-22.04

      fail-fast: false

    steps:
    - name: 设置设备和内核信息
      id: set-info
      run: |
        BOARD="${{ github.event.inputs.openwrt_board || 'panther_x2' }}"
        KERNEL="${{ github.event.inputs.openwrt_kernel || '5.10.y' }}"
        AUTO_KERNEL="${{ github.event.inputs.auto_kernel || 'true' }}"
        KERNEL_REPO="${{ github.event.inputs.kernel_repo || '1737255535/kernel' }}"
        echo "BOARD=${BOARD}" >> $GITHUB_ENV
        echo "KERNEL=${KERNEL}" >> $GITHUB_ENV
        echo "AUTO_KERNEL=${AUTO_KERNEL}" >> $GITHUB_ENV
        echo "KERNEL_REPO=${KERNEL_REPO}" >> $GITHUB_ENV
        echo "============================================"
        echo "  编译设备: ${BOARD}"
        echo "  内核版本: ${KERNEL}"
        echo "  自动最新内核: ${AUTO_KERNEL}"
        echo "  内核仓库: ${KERNEL_REPO}"
        echo "  源码分支: ${{ matrix.REPO_BRANCH }}"
        echo "============================================"

    - name: 合并磁盘
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 4096
        temp-reserve-mb: 512
        root-reserve-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: 准备完成
      uses: actions/checkout@main

    - name: 创建工作目录
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/workdir
        chmod 755 ${GITHUB_WORKSPACE}/workdir
        echo "WORKDIR_PATH=$PWD" >> $GITHUB_ENV

    - name: 检查服务器配置
      run: |
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "------------------------------- 磁盘详情 -------------------------------\n"
        df -Th

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "------------------------------- 更新并安装依赖 -------------------------------"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/${{ matrix.os }})
        sudo -E apt-get -qq install python3-pip
        sudo pip3 install --break-system-packages pyelftools || sudo pip3 install pyelftools || true
        echo "------------------------------- 清理Docker镜像和软件 -------------------------------"
        [ -n "$(docker images -q)" ] && docker rmi $(docker images -q) || true
        docker image prune -a -f || true
        sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        echo "------------------------------- 深度清理系统空间 -------------------------------"
        sudo rm -rf /usr/share/doc /usr/share/man /usr/share/locale /usr/share/info
        sudo rm -rf /usr/share/vim /usr/share/nano /usr/share/lintian /usr/share/linda
        sudo rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*
        sudo rm -rf /var/cache/pip /root/.cache
        sudo rm -rf /usr/share/pixmaps /usr/share/icons /usr/share/applications
        sudo rm -rf /usr/share/fonts /usr/share/groff /usr/share/texinfo
        df -h
        echo "------------------------------- 设置时区 -------------------------------"
        sudo timedatectl set-timezone "$TZ"

    - name: 克隆源码
      working-directory: ${{ env.WORKDIR_PATH }}/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b ${{ matrix.REPO_BRANCH }} openwrt
        ln -sf ${{ env.WORKDIR_PATH }}/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.os }}-${{ matrix.ARCHITECTURE }}-${{ matrix.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt
      env:
        CCACHE_DIR: /tmp/ccache

    - name: 限制 ccache 大小
      run: ccache -M 2G

    - name: 加载自定义 feeds
      env:
        FEEDS_CONF_PATH: ${{ matrix.ARCHITECTURE }}/${{ env.FEEDS_CONF }}
      run: |
        [ -e $FEEDS_CONF_PATH ] && mv $FEEDS_CONF_PATH openwrt/$FEEDS_CONF
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 清理 feeds 和 git 缓存释放空间
      run: |
        cd openwrt
        find feeds -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
        rm -rf tmp
        df -h

    - name: 下载预编译内核
      id: download-kernel
      run: |
        echo "============================================"
        echo "  从 ${KERNEL_REPO} 下载预编译内核"
        echo "  内核版本: ${KERNEL}"
        echo "============================================"
        
        # 获取最新内核版本
        KERNEL_VERSION=$(curl -fsSL "https://api.github.com/repos/${KERNEL_REPO}/releases/tags/kernel_rk35xx" | jq -r '.tag_name' || echo "")
        
        if [ -z "${KERNEL_VERSION}" ] || [ "${KERNEL_VERSION}" == "null" ]; then
          echo "无法获取内核版本信息，将使用默认内核编译"
          echo "status=skip" >> ${GITHUB_OUTPUT}
          exit 0
        fi
        
        echo "内核版本: ${KERNEL_VERSION}"
        
        # 下载内核文件
        KERNEL_URL=$(curl -fsSL "https://api.github.com/repos/${KERNEL_REPO}/releases/tags/${KERNEL_VERSION}" | jq -r ".assets[] | select(.name | test(\"${KERNEL}.*rk35xx.*\\.tar\\.gz$\")) | .browser_download_url" | head -1)
        
        if [ -z "${KERNEL_URL}" ] || [ "${KERNEL_URL}" == "null" ]; then
          echo "未找到匹配的内核文件，将使用默认内核编译"
          echo "status=skip" >> ${GITHUB_OUTPUT}
          exit 0
        fi
        
        echo "下载地址: ${KERNEL_URL}"
        
        # 创建内核目录并下载
        mkdir -p ${{ github.workspace }}/openwrt/dl/kernel
        cd ${{ github.workspace }}/openwrt/dl/kernel
        wget -q "${KERNEL_URL}" -O "kernel_rk35xx.tar.gz"
        
        if [ -f "kernel_rk35xx.tar.gz" ]; then
          echo "内核下载成功"
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -h
        else
          echo "内核下载失败，将使用默认内核编译"
          echo "status=skip" >> ${GITHUB_OUTPUT}
        fi

    - name: 安装预编译内核
      if: steps.download-kernel.outputs.status == 'success'
      run: |
        echo "============================================"
        echo "  安装预编译内核"
        echo "============================================"
        
        KERNEL_FILE="${{ github.workspace }}/openwrt/dl/kernel/kernel_rk35xx.tar.gz"
        
        if [ -f "${KERNEL_FILE}" ]; then
          # 解压内核文件
          cd ${{ github.workspace }}/openwrt
          tar -xzf "${KERNEL_FILE}" -C dl/ || true
          
          # 清理内核编译目录（如果存在）
          rm -rf build_dir/target-*/linux-* 2>/dev/null || true
          
          echo "预编译内核安装完成"
          df -h
        else
          echo "内核文件不存在，跳过安装"
        fi

    - name: 加载自定义配置
      env:
        CONFIG_FILE_PATH: ${{ matrix.ARCHITECTURE }}/${{ env.CONFIG_FILE }}
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE_PATH ] && mv $CONFIG_FILE_PATH openwrt/$CONFIG_FILE
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH "${{ env.BOARD }}" "${{ env.KERNEL }}"

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 清理旧的构建产物
      run: |
        cd openwrt
        rm -rf build_dir/target-* staging_dir/target-*
        rm -rf tmp .tmp
        df -h

    - name: 检查可用磁盘空间
      run: |
        echo "============================================"
        echo "  磁盘空间检查"
        echo "============================================"
        df -h
        echo ""
        AVAIL_ROOT=$(df -BG --output=avail / | tail -1 | tr -d 'G ')
        AVAIL_WORK=$(df -BG --output=avail ${GITHUB_WORKSPACE} 2>/dev/null | tail -1 | tr -d 'G ' || echo "0")
        echo "根分区可用空间: ${AVAIL_ROOT}GB"
        echo "工作目录可用空间: ${AVAIL_WORK}GB"
        echo ""
        if [ "${AVAIL_ROOT}" -lt 3 ] && [ "${AVAIL_WORK}" -lt 3 ]; then
          echo "磁盘剩余空间不足 3GB，终止编译"
          exit 1
        elif [ "${AVAIL_ROOT}" -lt 2 ] || [ "${AVAIL_WORK}" -lt 2 ]; then
          echo "警告: 磁盘空间较低，编译可能失败"
        fi

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "------------------------------- 编译完成，清理中间文件释放空间 -------------------------------"
        find build_dir -name "*.o" -delete 2>/dev/null || true
        find staging_dir -name "*.o" -delete 2>/dev/null || true
        find build_dir -name "*.a" -delete 2>/dev/null || true
        rm -rf staging_dir/toolchain-* 2>/dev/null || true
        rm -rf tmp .tmp
        df -h
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 文件夹
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.BOARD }}_${{ env.KERNEL }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.BOARD }}_${{ env.KERNEL }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H.%M")-${{ env.BOARD }}-kernel${{ env.KERNEL }}" >> ${GITHUB_OUTPUT}
        touch release.txt
        echo "
        💻 设备: ${{ env.BOARD }}

        🐧 内核: ${{ env.KERNEL }}

        📂 源码: ${{ env.REPO_URL }}

        🌳 分支: ${{ matrix.REPO_BRANCH }}

        ⏱️ 编译时间: $(date +"%Y年%m月%d日%H时%M分")

        🌐 管理地址: 192.168.100.1

        👤 用户名: root

        🔒 密码: password

        📒 说明: 单网口设备默认网口为LAN，旁路由模式，需要接入主路由器后进后台查找对应IP地址访问，反之双网口设备默认网口为WAN+LAN，主路由模式。 " >> release.txt
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 自动发布固件到 Releases
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除运行记录
      uses: xiaomeng9597/delete-workflow-runs@main
      with:
        retain_days: 20
        keep_minimum_runs: 15
        token: ${{ env.GITHUB_TOKEN }}

    - name: 删除自动发布的旧固件
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 60
        delete_tags: true
